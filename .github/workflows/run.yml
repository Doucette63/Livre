name: Goupil

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'   # relance auto toutes les 4h, en sécurité sous les 5h50 du script
    
jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    concurrency:
      group: goupil
      cancel-in-progress: true  # Si un run est déjà en cours pour ce groupe, annule-le immédiatement et laisse le nouveau run prendre sa place

      
# 1️⃣ Récupération du code
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

        
# 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"


# 3️⃣ Installation des dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4


# 4️⃣ Lancement du script
      - name: Run Vinted Bot
        env:
          VINTED_URLS: "https://www.vinted.fr/catalog?search_text=il+%C3%A9tait+une+fois+un+coeur+bris%C3%A9&catalog%5B%5D=2312&page=1&time=1788255114,https://www.vinted.fr/catalog?search_text=fae%20de%20sel%20et%20de%20sang&catalog[]=2312&page=1&time=1788257792&search_by_image_uuid=&search_by_image_id=,https://www.vinted.fr/catalog?search_text=le%20peuple%20de%20l%27air&catalog[]=2312&page=1&time=1788257838&search_by_image_uuid=&search_by_image_id="
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_STATUS: ${{ secrets.DISCORD_WEBHOOK_STATUS }}
        run: python main.py
          

# 5️⃣ Commit automatique de seen.json
      - name: Commit seen.json        
        run: |
          git config --global user.name "Doucette"
          git config --global user.email "vinted-bot@example.com"
          git add seen.json
          git commit -m "Update seen.json [ci skip]" || echo "✅ Pas de nouvelles annonces à commit"
          git push
